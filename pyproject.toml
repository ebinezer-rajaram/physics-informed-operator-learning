[project]
name = "physics-informed-operator-learning"
version = "0.1.0"
description = "PINNs for linear elasticity and neural operators (CNN, FNO) for Darcy flow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
